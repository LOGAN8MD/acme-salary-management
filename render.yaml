services:
  - type: web
    name: acme-salary-management
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev --ignore-scripts
    startCommand: npm run db:migrate && npm start
    initialDeployHook: npm run db:seed:production
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: APP_ORIGIN
        sync: false
      - key: SEED_HR_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salary-database
          property: connectionString

databases:
  - name: acme-salary-database
    plan: free
    region: singapore
    databaseName: acme
    user: acme
    postgresMajorVersion: '18'
    ipAllowList: []
